services:
  - type: worker
    name: jarvis-telegram-24-7
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_TELEGRAM_USER_IDS
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
